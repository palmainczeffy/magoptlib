version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.11"   # safer than 3.12 for many stacks
  jobs:
    post_create_environment:
      - pip install --upgrade pip
      - pip install "poetry>=1.6"
      # Tell Poetry to use RTD's venv (instead of creating its own)
      - poetry config virtualenvs.create false
    post_install:
      - poetry install --with docs --no-interaction --no-ansi

sphinx:
  configuration: docs/conf.py



